appId: dev.switchboard.prototype
productName: Switchboard
artifactName: ${productName}-${version}-${arch}.${ext}
publish:
  - provider: github
    owner: IEver3st
    repo: switchboard
    releaseType: release
files:
  - out/**
  - package.json
extraResources:
  - from: resources/branding
    to: branding
  - from: .switchboard/build/capture-host
    to: capture-host
  - from: .switchboard/build/audio-host
    to: audio-host
asar: true
asarUnpack:
  - resources/**
  - node_modules/node-hid/**
win:
  icon: build/icon.ico
  target:
    - nsis
  executableName: switchboard
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
