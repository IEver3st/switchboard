name: Native check

on:
  pull_request:
    paths:
      - "switchboard-rs/**"
      - ".github/workflows/native-check.yml"

permissions:
  contents: read

jobs:
  native-app:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: switchboard-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: switchboard-rs
      - run: cargo test --release --workspace --no-run
      - run: cargo test --release -p switchboard-project -p switchboard-export -p switchboard-autocapture
