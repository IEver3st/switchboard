name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $releaseVersion = '${{ github.ref_name }}' -replace '^v', ''
          $packageVersion = (Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json).version
          if ($releaseVersion -ne $packageVersion) {
            throw "Tag version $releaseVersion does not match package version $packageVersion."
          }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          $tagIsOnMain = $LASTEXITCODE -eq 0
          if (-not $tagIsOnMain) {
            $releaseBranch = 'release/${{ github.ref_name }}'
            git fetch origin "refs/heads/$releaseBranch`:refs/remotes/origin/$releaseBranch"
            if ($LASTEXITCODE -ne 0) {
              throw "Release tag ${{ github.ref_name }} is not on main and its protected release branch is missing."
            }
            git merge-base --is-ancestor $env:GITHUB_SHA "origin/$releaseBranch"
            if ($LASTEXITCODE -ne 0) {
              throw "Release tag ${{ github.ref_name }} is not on main or origin/$releaseBranch."
            }
          }
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check:source
      - run: bun run check:types
      - run: bun run test
      - name: Install FFmpeg packaging dependency
        shell: pwsh
        run: |
          choco install ffmpeg-full --version 9.0.1 --yes --no-progress
          $ffmpegTools = Join-Path $env:ChocolateyInstall 'lib\ffmpeg-full\tools'
          $ffmpeg = Get-ChildItem -LiteralPath $ffmpegTools -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem -LiteralPath $ffmpegTools -Filter ffprobe.exe -File -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) {
            throw 'Chocolatey installed ffmpeg-full without the required ffmpeg.exe and ffprobe.exe binaries.'
          }
          "SWITCHBOARD_FFMPEG=$($ffmpeg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SWITCHBOARD_FFPROBE=$($ffprobe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: bun run release:win
      - name: Publish checksum manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseVersion = '${{ github.ref_name }}' -replace '^v', ''
          $assetNames = @(
            "Switchboard-$releaseVersion-x64.exe",
            "Switchboard-$releaseVersion-x64.exe.blockmap",
            "latest.yml"
          )
          $checksumLines = foreach ($assetName in $assetNames) {
            $assetPath = Join-Path dist $assetName
            if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
              throw "Expected release artifact is missing: $assetPath"
            }
            $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $assetName"
          }
          $checksumPath = Join-Path dist 'SHA256SUMS-Windows.txt'
          $checksumLines | Set-Content -LiteralPath $checksumPath -Encoding utf8
          gh release upload '${{ github.ref_name }}' $checksumPath --repo '${{ github.repository }}' --clobber
      - name: Verify published update feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseVersion = '${{ github.ref_name }}' -replace '^v', ''
          $publishedAssets = @(gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}' --json assets --jq '.assets[].name')
          $requiredAssets = @(
            "Switchboard-$releaseVersion-x64.exe",
            "Switchboard-$releaseVersion-x64.exe.blockmap",
            "latest.yml",
            "SHA256SUMS-Windows.txt"
          )
          foreach ($assetName in $requiredAssets) {
            if ($publishedAssets -notcontains $assetName) {
              throw "Published release is missing required asset: $assetName"
            }
          }

