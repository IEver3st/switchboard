name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SONY_MDR_TOKEN }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $releaseVersion = '${{ github.ref_name }}' -replace '^v', ''
          $packageVersion = (Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json).version
          if ($releaseVersion -ne $packageVersion) {
            throw "Tag version $releaseVersion does not match package version $packageVersion."
          }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          $tagIsOnMain = $LASTEXITCODE -eq 0
          if (-not $tagIsOnMain) {
            $releaseBranch = 'release/${{ github.ref_name }}'
            git fetch origin "refs/heads/$releaseBranch`:refs/remotes/origin/$releaseBranch"
            if ($LASTEXITCODE -ne 0) {
              throw "Release tag ${{ github.ref_name }} is not on main and its protected release branch is missing."
            }
            git merge-base --is-ancestor $env:GITHUB_SHA "origin/$releaseBranch"
            if ($LASTEXITCODE -ne 0) {
              throw "Release tag ${{ github.ref_name }} is not on main or origin/$releaseBranch."
            }
          }
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check:source
      - run: bun run check:types
      - run: bun run test
      - name: Install FFmpeg packaging dependency
        shell: pwsh
        run: |
          choco install ffmpeg-full --version 9.0.1 --yes --no-progress
          $ffmpegTools = Join-Path $env:ChocolateyInstall 'lib\ffmpeg-full\tools'
          $ffmpeg = Get-ChildItem -LiteralPath $ffmpegTools -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem -LiteralPath $ffmpegTools -Filter ffprobe.exe -File -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) {
            throw 'Chocolatey installed ffmpeg-full without the required ffmpeg.exe and ffprobe.exe binaries.'
          }
          "SWITCHBOARD_FFMPEG=$($ffmpeg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SWITCHBOARD_FFPROBE=$($ffprobe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare single draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseVersion = '${{ github.ref_name }}' -replace '^v', ''
          gh release create '${{ github.ref_name }}' --repo '${{ github.repository }}' --verify-tag --draft --title "Switchboard $releaseVersion"
      - run: bun run release:win
      - name: Verify packaged updater runtime
        run: bun run verify:packaged-updater
      - name: Publish checksum manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseVersion = '${{ github.ref_name }}' -replace '^v', ''
          $assetNames = @(
            "Switchboard-$releaseVersion-x64.exe",
            "Switchboard-$releaseVersion-x64.exe.blockmap",
            "latest.yml"
          )
          $checksumLines = foreach ($assetName in $assetNames) {
            $assetPath = Join-Path dist $assetName
            if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
              throw "Expected release artifact is missing: $assetPath"
            }
            $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $assetName"
          }
          $checksumPath = Join-Path dist 'SHA256SUMS-Windows.txt'
          $checksumLines | Set-Content -LiteralPath $checksumPath -Encoding utf8
          $deadline = (Get-Date).AddMinutes(5)
          while ($true) {
            gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}' --json isDraft | Out-Null
            if ($LASTEXITCODE -eq 0) { break }
            if ((Get-Date) -ge $deadline) {
              throw 'The draft release was not created within five minutes.'
            }
            Start-Sleep -Seconds 10
          }
          gh release upload '${{ github.ref_name }}' $checksumPath --repo '${{ github.repository }}' --clobber
      - name: Await complete draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseVersion = '${{ github.ref_name }}' -replace '^v', ''
          $requiredAssets = @(
            "Switchboard-$releaseVersion-x64.exe",
            "Switchboard-$releaseVersion-x64.exe.blockmap",
            "latest.yml",
            "SHA256SUMS-Windows.txt"
          )

          $matchingReleases = @(gh api 'repos/${{ github.repository }}/releases?per_page=100' | ConvertFrom-Json | Where-Object { $_.tag_name -eq '${{ github.ref_name }}' })
          if ($matchingReleases.Count -ne 1) {
            throw "Expected one draft release for ${{ github.ref_name }}, found $($matchingReleases.Count)."
          }
          $releaseId = $matchingReleases[0].id

          $deadline = (Get-Date).AddMinutes(10)
          while ($true) {
            $release = gh api "repos/${{ github.repository }}/releases/$releaseId" | ConvertFrom-Json
            if (-not $release.draft) {
              throw 'The release became public before packaged updater verification completed.'
            }

            $assetsByName = @{}
            foreach ($asset in @($release.assets)) {
              $assetsByName[$asset.name] = $asset
            }
            $missingAssets = @($requiredAssets | Where-Object {
              -not $assetsByName.ContainsKey($_) -or $assetsByName[$_].size -le 0
            })
            if ($missingAssets.Count -eq 0) { break }
            if ((Get-Date) -ge $deadline) {
              throw "Draft release is incomplete after ten minutes: $($missingAssets -join ', ')"
            }
            Start-Sleep -Seconds 10
          }
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseVersion = '${{ github.ref_name }}' -replace '^v', ''
          gh release edit '${{ github.ref_name }}' --repo '${{ github.repository }}' --draft=false --latest --title "Switchboard $releaseVersion"
      - name: Verify anonymous public update feed
        shell: pwsh
        run: |
          $releaseVersion = '${{ github.ref_name }}' -replace '^v', ''
          $installerName = "Switchboard-$releaseVersion-x64.exe"
          $feedUrl = "https://github.com/${{ github.repository }}/releases/latest/download/latest.yml?run=${{ github.run_id }}"
          $deadline = (Get-Date).AddMinutes(5)
          while ($true) {
            try {
              $response = Invoke-WebRequest -Uri $feedUrl -Headers @{ 'Cache-Control' = 'no-cache' }
              $content = if ($response.Content -is [byte[]]) {
                [System.Text.Encoding]::UTF8.GetString($response.Content)
              } else {
                [string]$response.Content
              }
              $hasVersion = $content -match "(?m)^version:\s*$([regex]::Escape($releaseVersion))\s*$"
              $hasInstaller = $content.Contains($installerName)
              $hasChecksum = $content -match "(?m)^sha512:\s*\S+"
              if ($response.StatusCode -eq 200 -and $hasVersion -and $hasInstaller -and $hasChecksum) {
                break
              }
            } catch {
              Write-Host "Public update feed is not ready yet: $($_.Exception.Message)"
            }

            if ((Get-Date) -ge $deadline) {
              throw 'The anonymous public update feed did not expose the verified release within five minutes.'
            }
            Start-Sleep -Seconds 10
          }

