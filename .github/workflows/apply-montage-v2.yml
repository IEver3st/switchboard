name: Apply montage v2 source payload

on:
  push:
    branches:
      - feat/montage-v2
    paths:
      - .automation/montage-v2-remaining.tgz

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/montage-v2
          fetch-depth: 0

      - name: Expand source payload
        shell: bash
        run: |
          tar -xzf .automation/montage-v2-remaining.tgz -C .
          rm .automation/montage-v2-remaining.tgz
          rmdir .automation 2>/dev/null || true

      - name: Commit expanded source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Complete montage v2 composer source"
          git push origin HEAD:feat/montage-v2
