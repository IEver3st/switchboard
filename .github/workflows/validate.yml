name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - run: bun run check
      - run: bun run check:types
      - run: bun run build

  native-hosts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build .\engines\capture-host\Capture.Host.csproj --configuration Release
      - run: dotnet build .\engines\audio-host\Audio.Host.csproj --configuration Release
