name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - run: bun run check
      - run: bun run check:types
      - run: bun run build
      - run: node scripts/verify-update-installer.mjs

  native-hosts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build .\engines\capture-host\Capture.Host.csproj --configuration Release

  native-app:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: switchboard-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: switchboard-rs
      # Hardware-dependent suites (capture, media, app) are compiled, not run;
      # hosted runners have no GPU or audio devices.
      - run: cargo test --release --workspace --no-run
      - run: cargo test --release -p switchboard-project -p switchboard-export -p switchboard-autocapture
