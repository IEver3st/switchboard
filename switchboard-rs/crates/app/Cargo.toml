[package]
name = "switchboard"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
# Distinct from the Electron build's switchboard.exe while both exist.
name = "switchboard-rs"
path = "src/main.rs"

[dependencies]
switchboard-capture = { path = "../capture" }
switchboard-project = { path = "../project" }
switchboard-export = { path = "../export" }
switchboard-autocapture = { path = "../autocapture" }
switchboard-media = { path = "../media" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# CPU-rendered egui: measured 23 MB private for a bare window versus 240 MB
# for eframe on OpenGL on the reference AMD system.
egui = { version = "0.34", default-features = false, features = ["default_fonts"] }
egui_software_backend = "0.0.3"
tray-icon = "0.26"
global-hotkey = "0.8"
png = "0.18"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_Networking_WinHttp",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"
